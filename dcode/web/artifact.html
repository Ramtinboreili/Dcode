<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artifact · Dcode</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<script>
  try { const t = localStorage.getItem("dcode-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (_) {}
</script>
<link rel="stylesheet" href="/theme.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  code, pre { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  header { height: 56px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .home { display: flex; align-items: center; text-decoration: none; padding: 4px; border-radius: 8px; }
  .home svg { width: 34px; height: 22px; }
  .home:hover { background: var(--surface-2); }
  .meta { flex: 1; min-width: 0; }
  .title { font-weight: 650; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--muted); font-size: 12.5px; }
  select, .btn { height: 34px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); border-radius: 9px; padding: 0 12px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .btn:hover, select:hover { background: var(--surface-2); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--primary-hover); }
  a.btn { display: inline-flex; align-items: center; text-decoration: none; }
  main { flex: 1; min-height: 0; overflow: auto; }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  pre.code { margin: 0; padding: 20px 24px; font-size: 13px; line-height: 1.6; background: var(--code-bg); min-height: 100%; }
  .md { max-width: 820px; margin: 0 auto; padding: 32px 28px 60px; font-size: 15.5px; line-height: 1.7; }
  .md h1, .md h2, .md h3 { line-height: 1.3; } .md code { background: var(--surface-2); padding: 1px 6px; border-radius: 6px; font-size: .88em; }
  .md pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; overflow-x: auto; } .md pre code { background: none; padding: 0; }
  .csv { border-collapse: collapse; margin: 18px; font-size: 13.5px; background: var(--surface); }
  .csv th, .csv td { padding: 8px 12px; border: 1px solid var(--border); text-align: left; white-space: nowrap; }
  .csv th { background: var(--surface-2); position: sticky; top: 0; }
  .banner { padding: 8px 14px; background: var(--warning-soft); color: var(--warning); font-size: 13px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--border); }
  .empty { display: grid; place-items: center; height: 100%; color: var(--muted); }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 13px; }
  @media (max-width: 700px) { .hide-sm { display: none; } }
</style>
</head>
<body>
<header>
  <a class="home" href="/" title="Open Dcode">
    <svg viewBox="0 0 64 40"><path d="M11 2H53L62 11V29L53 38H11L2 29V11Z" fill="var(--primary-soft)" stroke="var(--primary)" stroke-width="2.4" stroke-linejoin="round"/><g fill="none" stroke="var(--primary)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 12H19.5C25 12 28 15.6 28 20C28 24.4 25 28 19.5 28H14Z"/><path d="M33 14L39 20L33 26"/></g><rect x="42" y="25" width="8" height="3.4" rx="1.7" fill="var(--accent)"/></svg>
  </a>
  <div class="meta"><div class="title" id="title">Loading…</div><div class="sub" id="sub"></div></div>
  <select id="version" title="Version" hidden></select>
  <select id="view" title="View" hidden><option value="preview">Preview</option><option value="code">Code</option></select>
  <button class="btn hide-sm" id="copy">Copy</button>
  <button class="btn hide-sm" id="link">Copy link</button>
  <a class="btn" id="download">Download</a>
  <a class="btn primary" id="open" href="/">Open in Dcode</a>
</header>
<div class="banner" id="banner" hidden></div>
<main id="main"><div class="empty">Loading…</div></main>
<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const id = decodeURIComponent(location.pathname.split("/a/")[1] || "").replace(/\/$/, "");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const CSP = `<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; media-src data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:">`;
  const KIND = { html: "Web page", svg: "Diagram", markdown: "Document", csv: "Table", code: "Code" };
  let data = null, view = "preview", version = null;

  function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 1800); }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); } catch (_) { const ta = document.createElement("textarea"); ta.value = text; document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
    toast("Copied");
  }
  function md(src) {
    const out = []; const lines = esc(src).split("\n"); let i = 0;
    const inl = (s) => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    while (i < lines.length) {
      const l = lines[i];
      if (/^\s*```/.test(l)) { const b = []; i++; while (i < lines.length && !/^\s*```/.test(lines[i])) b.push(lines[i++]); i++; out.push(`<pre><code>${b.join("\n")}</code></pre>`); continue; }
      const h = l.match(/^(#{1,3})\s+(.*)/); if (h) { out.push(`<h${h[1].length}>${inl(h[2])}</h${h[1].length}>`); i++; continue; }
      if (/^\s*[-*]\s+/.test(l)) { const it = []; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) it.push(`<li>${inl(lines[i++].replace(/^\s*[-*]\s+/, ""))}</li>`); out.push(`<ul>${it.join("")}</ul>`); continue; }
      if (/^\s*\d+[.)]\s+/.test(l)) { const it = []; while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) it.push(`<li>${inl(lines[i++].replace(/^\s*\d+[.)]\s+/, ""))}</li>`); out.push(`<ol>${it.join("")}</ol>`); continue; }
      if (!l.trim()) { i++; continue; }
      const p = []; while (i < lines.length && lines[i].trim() && !/^(\s*```|#{1,3}\s|\s*[-*]\s|\s*\d+[.)]\s)/.test(lines[i])) p.push(lines[i++]);
      out.push(`<p>${inl(p.join("<br>"))}</p>`);
    }
    return out.join("");
  }
  function csv(text) {
    const rows = []; let row = [], cell = "", q = false;
    for (let i = 0; i < text.length; i++) { const c = text[i];
      if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
      else if (c === '"') q = true; else if (c === ",") { row.push(cell); cell = ""; } else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; } else if (c !== "\r") cell += c; }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    const [head, ...body] = rows;
    return `<table class="csv"><thead><tr>${(head || []).map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${body.slice(0, 5000).map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  }
  function sandboxDoc(kind, content) {
    if (kind === "svg") return `<!doctype html><html><head><meta charset="utf-8">${CSP}<style>html,body{margin:0;height:100%;background:#fff}body{display:grid;place-items:center;padding:24px;box-sizing:border-box}svg{max-width:100%;max-height:100%;height:auto}</style></head><body>${content}</body></html>`;
    if (/<head[^>]*>/i.test(content)) return content.replace(/<head[^>]*>/i, (m) => m + CSP);
    return `<!doctype html><html><head><meta charset="utf-8">${CSP}</head><body>${content}</body></html>`;
  }
  function render() {
    const main = $("#main");
    const visual = ["html", "svg", "markdown", "csv"].includes(data.kind);
    $("#view").hidden = !visual;
    if (view === "code" || !visual) { main.innerHTML = `<pre class="code"><code>${esc(data.content)}</code></pre>`; return; }
    if (data.kind === "markdown") { main.innerHTML = `<div class="md">${md(data.content)}</div>`; return; }
    if (data.kind === "csv") { main.innerHTML = csv(data.content); return; }
    const f = document.createElement("iframe");
    f.setAttribute("sandbox", "allow-scripts allow-modals");
    f.setAttribute("referrerpolicy", "no-referrer");
    f.title = data.title;
    f.srcdoc = sandboxDoc(data.kind, data.content);
    main.replaceChildren(f);
  }
  async function load(v) {
    const res = await fetch(`/api/artifacts/${encodeURIComponent(id)}${v ? `?version=${v}` : ""}`, { credentials: "same-origin" });
    if (!res.ok) { $("#title").textContent = "Artifact not found"; $("#main").innerHTML = `<div class="empty">This artifact doesn't exist or was deleted.</div>`; return; }
    data = await res.json();
    version = v || null;
    document.title = `${data.title} · Dcode`;
    $("#title").textContent = data.title;
    $("#sub").textContent = `${KIND[data.kind] || "Code"}${data.language ? ` · ${data.language}` : ""} · v${data.versions}`;
    const sel = $("#version");
    sel.hidden = data.history.length < 2;
    sel.innerHTML = data.history.slice().reverse().map((h) => `<option value="${h.version}">v${h.version}${h.current ? " (latest)" : ""} · ${new Date(h.updated).toLocaleString()}</option>`).join("");
    sel.value = String(v || data.versions);
    const banner = $("#banner");
    if (v && v !== data.versions) { banner.hidden = false; banner.textContent = `You're viewing an older version (v${v}). Open it in Dcode to restore it.`; } else banner.hidden = true;
    $("#download").href = `/api/artifacts/${encodeURIComponent(id)}/raw`;
    $("#open").href = `/#a=${encodeURIComponent(id)}`;
    render();
  }
  $("#version").addEventListener("change", (e) => { const v = Number(e.target.value); load(v === data.versions ? null : v); });
  $("#view").addEventListener("change", (e) => { view = e.target.value; render(); });
  $("#copy").addEventListener("click", () => data && copy(data.content));
  $("#link").addEventListener("click", () => copy(location.origin + location.pathname));
  load(null);
})();
</script>
</body>
</html>
