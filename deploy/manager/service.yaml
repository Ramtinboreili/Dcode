apiVersion: v1
kind: Service
metadata:
  name: dcode-manager
  namespace: dcode
spec:
  selector: {app: dcode-manager}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
# Reachable from outside the cluster on every node's port 31010 (or use an Ingress with TLS).
apiVersion: v1
kind: Service
metadata:
  name: dcode-manager-nodeport
  namespace: dcode
spec:
  type: NodePort
  selector: {app: dcode-manager}
  ports:
    - {name: http, port: 8080, targetPort: http, nodePort: 31010}
