# The first admin, created on the first start when the database has no user yet.
# Change the password before applying (or create the secret yourself and drop this file).
apiVersion: v1
kind: Secret
metadata:
  name: dcode-manager-admin
  namespace: dcode
type: Opaque
stringData:
  DCODE_MANAGER_ADMIN: admin
  DCODE_MANAGER_ADMIN_PASSWORD: change-me-now
