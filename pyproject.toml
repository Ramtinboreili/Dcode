[build-system]
requires = [
  "setuptools>=64.0",
  "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "dcode"
description = "Dcode — coding agent (CLI + local web UI) for local / air-gapped LLMs"
requires-python = ">=3.10"
dynamic = ["version"]
readme = "README.md"
dependencies = [
  "openai>=1.0.0",
  "rich>=13.0.0",
  "click>=8.0.0",
  "prompt_toolkit>=3.0.0",
  "httpx>=0.24.0",
  "pg8000>=1.30",
  "PyMySQL>=1.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.1",
  "pyinstaller>=6.0"
]

[project.scripts]
dcode = "dcode.__main__:main"

[tool.setuptools]
packages = ["dcode", "dcode.manager"]

[tool.setuptools.package-data]
dcode = ["web/*", "skills/*.md", "manager/web/*"]

[tool.setuptools.dynamic]
version = { attr = "dcode.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Broad excepts are deliberate at tool / UI boundaries: one bad tool call or a
# closed browser tab must never kill the agent loop.
ignore = ["E501", "B008"]
