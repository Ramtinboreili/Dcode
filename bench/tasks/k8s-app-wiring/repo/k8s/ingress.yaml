apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog
  namespace: blog
spec:
  ingressClassName: traefik
  rules:
    - host: blog.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blog-web
                port:
                  number: 8080
