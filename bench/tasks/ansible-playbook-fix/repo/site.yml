- hosts: web_servers
  become: yes
  vars:
    nginx_port: 8080
  tasks:
    - name: install nginx
      apt:
        name: nginx
        state: latest
        update_cache: yes
    - name: write config
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
      notify: restart nginx service
    - name: start nginx
      service:
        name: nginx
        state: started
      when: "{{ ansible_os_family == 'Debian' }}"
  handlers:
    - name: Restart Nginx
      service:
        name: nginx
        state: restart
