apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: api
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: api.example.internal
      http:
        paths:
          - path: /v1
            backend:
              serviceName: api
              servicePort: 9000
