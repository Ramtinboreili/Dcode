events {
    worker_connections 1024;
}

http {
    access_log off;

    upstream app_backend {
        server 127.0.0.1:8080
    }

    server {
        listen 8081;
        server_name site.example.internal;

        location /api/ {
            proxy_pass http://app-backend;
            proxy_set_header Host $host;
        }

        location / {
            root /var/www/site
            index index.html;
        }
