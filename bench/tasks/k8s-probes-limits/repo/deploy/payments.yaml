apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - name: payments
          image: registry.local/payments:2.8.1
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              value: db.prod
        - name: log-shipper
          image: registry.local/fluent-bit:3.0
          volumeMounts:
            - name: logs
              mountPath: /var/log/app
      volumes:
        - name: logs
          emptyDir: {}
